<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes recettes</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#2F6B4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recettes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5EF;--surface:#fff;--ink:#1E2B22;--muted:#5D6B61;--accent:#2F6B4F;--soft:#DCE9DF;--star:#C98F00;--line:#D5DDD2;--danger:#B3402F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top)}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 120px}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;line-height:1.1;margin:0;font-weight:800}
h1{font-size:2.3rem}
h2{font-size:1.7rem}
h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.1rem;margin:22px 0 6px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
textarea{resize:vertical;min-height:90px}
label{display:block;font-weight:600;margin:14px 0 4px}
.btn{border:0;border-radius:999px;padding:12px 20px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--accent)}
.btn.danger{background:none;color:var(--danger);padding-left:4px}
.btn:disabled{opacity:.6;cursor:wait}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.item{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.open{flex:1;text-align:left;background:none;border:0;padding:14px 4px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.t{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:600;font-size:1.2rem;line-height:1.2}
.m{color:var(--muted);font-size:.9rem}
.star{background:none;border:0;font-size:1.5rem;color:var(--line);cursor:pointer;padding:8px 10px}
.star.on{color:var(--star)}
.empty{color:var(--muted);padding:28px 0}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));box-shadow:0 6px 18px rgba(30,43,34,.25);padding:14px 26px}
dialog{border:0;border-radius:18px;padding:0;width:calc(100% - 24px);max-width:600px;max-height:92vh;max-height:calc(100dvh - 24px);margin:max(12px,env(safe-area-inset-top)) auto auto;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(30,43,34,.5)}
.inner{padding:22px 20px 24px}
li{margin:6px 0}
ol li::marker{font-weight:700;color:var(--accent)}
.msg{margin-top:12px;color:var(--danger);min-height:1.4em}
.ok{color:var(--accent)}
#auth{max-width:380px;margin:12vh auto 0}
#auth p{color:var(--muted)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.chip,.btn{transition:background .15s}}
</style>
</head>
<body>
<div class="wrap">

  <section id="auth" hidden>
    <h1>Mes recettes</h1>
    <p>Connecte-toi ou crée un compte pour retrouver tes recettes sur tous tes appareils.</p>
    <label for="email">Adresse e-mail</label>
    <input id="email" type="email" autocomplete="email">
    <label for="pw">Mot de passe (6 caractères minimum)</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div class="row">
      <button class="btn" id="login">Se connecter</button>
      <button class="btn alt" id="signup">Créer un compte</button>
    </div>
    <div class="row"><button class="link" id="forgot">Mot de passe oublié ?</button></div>
    <div class="msg" id="authmsg" role="status"></div>
  </section>

  <section id="app" hidden>
    <div class="top">
      <h1>Mes recettes</h1>
      <div><button class="link" id="chpw">Changer le mot de passe</button><button class="link" id="logout">Se déconnecter</button></div>
    </div>
    <div class="row"><input id="search" type="search" placeholder="Rechercher une recette ou un ingrédient" aria-label="Rechercher"></div>
    <div class="chips" id="chips"></div>
    <div id="list"></div>
    <button class="btn fab" id="addbtn">Ajouter une recette</button>
  </section>
</div>

<dialog id="add"><div class="inner">
  <h2>Nouvelle recette</h2>
  <label for="src">Colle un lien ou le texte de la recette</label>
  <textarea id="src" placeholder="Par exemple la légende d’une vidéo, ou l’adresse d’un site de cuisine"></textarea>
  <div class="row">
    <button class="btn alt" id="paste">Coller le lien copié</button>
    <label class="btn alt" for="shot">Ajouter une capture d’écran</label>
    <input id="shot" type="file" accept="image/*" multiple hidden>
    <button class="btn alt" id="analyse">Créer la fiche</button>
  </div>
  <div class="msg" id="addmsg" role="status"></div>
  <label for="ftitle">Titre</label>
  <input id="ftitle">
  <label for="ffolder">Dossier</label>
  <input id="ffolder" list="folders" placeholder="Desserts, Plats du soir…">
  <datalist id="folders"></datalist>
  <label for="fing">Ingrédients (un par ligne)</label>
  <textarea id="fing"></textarea>
  <label for="fsteps">Étapes (une par ligne)</label>
  <textarea id="fsteps"></textarea>
  <div class="row">
    <button class="btn" id="save">Enregistrer</button>
    <button class="btn alt" id="cancel">Annuler</button>
  </div>
</div></dialog>

<dialog id="pwd"><div class="inner">
  <h2>Nouveau mot de passe</h2>
  <label for="npw">Nouveau mot de passe (6 caractères minimum)</label>
  <input id="npw" type="password" autocomplete="new-password">
  <div class="row">
    <button class="btn" id="pwsave">Enregistrer</button>
    <button class="btn alt" id="pwcancel">Annuler</button>
  </div>
  <div class="msg" id="pwmsg" role="status"></div>
</div></dialog>

<dialog id="view"><div class="inner">
  <div id="vbody"></div>
  <div class="row">
    <button class="btn alt" id="vfav"></button>
    <button class="btn alt" id="vclose">Fermer</button>
    <button class="btn danger" id="vdel">Supprimer</button>
  </div>
</div></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script>
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lines = t => t.split("\n").map(x => x.trim()).filter(Boolean);
let recipes = [], cur = null, filter = "all", loggedIn = false;

/* ---------- Connexion ---------- */
function openPwd() { $("#npw").value = ""; $("#pwmsg").textContent = ""; if (!$("#pwd").open) $("#pwd").showModal(); }
db.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY") setTimeout(openPwd, 400);
  if (session && !loggedIn) { loggedIn = true; $("#auth").hidden = true; $("#app").hidden = false; load().then(handleShared); }
  if (!session && (event === "SIGNED_OUT" || event === "INITIAL_SESSION")) { loggedIn = false; $("#app").hidden = true; $("#auth").hidden = false; }
});

async function authenticate(kind) {
  const email = $("#email").value.trim(), password = $("#pw").value, m = $("#authmsg");
  m.className = "msg"; m.textContent = "";
  if (!email || password.length < 6) { m.textContent = "Entre une adresse e-mail et un mot de passe d’au moins 6 caractères."; return; }
  const { data, error } = kind === "up" ? await db.auth.signUp({ email, password }) : await db.auth.signInWithPassword({ email, password });
  if (error) { m.textContent = /Invalid login/i.test(error.message) ? "E-mail ou mot de passe incorrect." : error.message; return; }
  if (kind === "up" && !data.session) { m.className = "msg ok"; m.textContent = "Compte créé. Vérifie ta boîte mail pour confirmer ton adresse, puis connecte-toi."; }
}
$("#login").onclick = () => authenticate("in");
$("#signup").onclick = () => authenticate("up");
$("#logout").onclick = () => db.auth.signOut();
$("#chpw").onclick = openPwd;
$("#pwcancel").onclick = () => $("#pwd").close();
$("#pwsave").onclick = async () => {
  const pw = $("#npw").value, m = $("#pwmsg");
  if (pw.length < 6) { m.className = "msg"; m.textContent = "Choisis au moins 6 caractères."; return; }
  const { error } = await db.auth.updateUser({ password: pw });
  if (error) { m.className = "msg"; m.textContent = error.message; return; }
  m.className = "msg ok"; m.textContent = "Mot de passe modifié.";
  setTimeout(() => $("#pwd").close(), 1200);
};
$("#forgot").onclick = async () => {
  const email = $("#email").value.trim(), m = $("#authmsg");
  if (!email) { m.className = "msg"; m.textContent = "Entre d’abord ton adresse e-mail dans le champ ci-dessus."; return; }
  const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: location.origin });
  m.className = error ? "msg" : "msg ok";
  m.textContent = error ? error.message : "E-mail envoyé. Ouvre le lien reçu pour choisir un nouveau mot de passe.";
};

/* ---------- Liste ---------- */
async function load() {
  const { data, error } = await db.from("recipes").select("*").order("created_at", { ascending: false });
  if (error) { $("#list").innerHTML = `<p class="empty">Impossible de charger tes recettes : ${esc(error.message)}</p>`; return; }
  recipes = data; render();
}

function render() {
  const q = $("#search").value.trim().toLowerCase();
  const folders = [...new Set(recipes.map(r => r.folder))].sort();
  const keys = [["all", "Tous"], ["fav", "Favoris"], ...folders.map(f => ["f:" + f, f])];
  $("#chips").innerHTML = keys.map(([k, l]) => `<button class="chip${filter === k ? " on" : ""}" data-k="${esc(k)}">${esc(l)}</button>`).join("");
  $("#folders").innerHTML = folders.map(f => `<option value="${esc(f)}">`).join("");
  const list = recipes.filter(r =>
    (filter === "all" || (filter === "fav" ? r.favorite : "f:" + r.folder === filter)) &&
    (!q || (r.title + " " + r.ingredients.join(" ")).toLowerCase().includes(q)));
  $("#list").innerHTML = list.length ? list.map(r => `
    <div class="item">
      <button class="open" data-id="${r.id}"><span class="t">${esc(r.title)}</span><span class="m">${esc(r.folder)}, ${r.ingredients.length} ingrédients</span></button>
      <button class="star${r.favorite ? " on" : ""}" data-fav="${r.id}" aria-label="Favori" aria-pressed="${!!r.favorite}">★</button>
    </div>`).join("")
    : `<p class="empty">${recipes.length ? "Aucune recette ne correspond." : "Aucune recette pour l’instant. Appuie sur « Ajouter une recette » pour commencer."}</p>`;
}

$("#search").oninput = render;
$("#chips").onclick = e => { const b = e.target.closest("[data-k]"); if (b) { filter = b.dataset.k; render(); } };
$("#list").onclick = e => {
  const o = e.target.closest("[data-id]"), s = e.target.closest("[data-fav]");
  if (o) openView(o.dataset.id);
  if (s) toggleFav(s.dataset.fav);
};

async function toggleFav(id) {
  const r = recipes.find(x => x.id === id); if (!r) return;
  const { error } = await db.from("recipes").update({ favorite: !r.favorite }).eq("id", id);
  if (!error) { r.favorite = !r.favorite; render(); if ($("#view").open) setFavLabel(); }
}

/* ---------- Fiche ---------- */
function openView(id) {
  cur = recipes.find(x => x.id === id); if (!cur) return;
  $("#vbody").innerHTML = `<h2>${esc(cur.title)}</h2><p class="m">${esc(cur.folder)}</p>
    <h3>Ingrédients</h3><ul>${cur.ingredients.map(i => `<li>${esc(i)}</li>`).join("")}</ul>
    <h3>Préparation</h3><ol>${cur.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
    ${cur.source_url ? `<p><a href="${esc(cur.source_url)}" target="_blank" rel="noopener">Voir la source</a></p>` : ""}`;
  setFavLabel(); $("#view").showModal();
}
const setFavLabel = () => $("#vfav").textContent = cur.favorite ? "Retirer des favoris" : "Ajouter aux favoris";
$("#vfav").onclick = () => toggleFav(cur.id);
$("#vclose").onclick = () => $("#view").close();
$("#vdel").onclick = async () => {
  if (!confirm("Supprimer cette recette ?")) return;
  const { error } = await db.from("recipes").delete().eq("id", cur.id);
  if (!error) { $("#view").close(); load(); }
};

/* ---------- Ajout ---------- */
function openAdd(link) {
  ["src", "ftitle", "ffolder", "fing", "fsteps"].forEach(id => $("#" + id).value = "");
  $("#addmsg").textContent = "";
  if (link) $("#src").value = link;
  if (!$("#add").open) $("#add").showModal();
  if (!link && document.activeElement) document.activeElement.blur();
  if (link) $("#analyse").click();
}
$("#addbtn").onclick = () => openAdd();

/* ---------- Lien reçu par le bouton Partager (raccourci iPhone, etc.) ---------- */
function handleShared() {
  let raw = location.hash.slice(1) || new URLSearchParams(location.search).get("u") || "";
  try { raw = decodeURIComponent(raw); } catch {}
  const m = raw.match(/https?:\/\/\S+/);
  if (!m) return;
  history.replaceState(null, "", location.pathname);
  openAdd(m[0]);
}
$("#cancel").onclick = () => $("#add").close();
$("#paste").onclick = async () => {
  const m = $("#addmsg");
  try {
    const t = (await navigator.clipboard.readText()).trim();
    if (!t) throw new Error("vide");
    $("#src").value = t;
    $("#analyse").click();
  } catch {
    m.className = "msg"; m.textContent = "Impossible de lire le presse-papiers. Touche la zone de texte, puis « Coller ».";
  }
};

async function runParse(payload) {
  const m = $("#addmsg"), b = $("#analyse");
  b.disabled = true; b.textContent = "Analyse en cours…"; m.textContent = "";
  try {
    const { data: { session } } = await db.auth.getSession();
    const r = await fetch("/api/parse", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.access_token }, body: JSON.stringify(payload) });
    let j = {}; try { j = await r.json(); } catch {}
    if (!r.ok) throw new Error(j.error || "Le serveur n’a pas pu analyser la recette. Réessaie avec moins d’images.");
    $("#ftitle").value = j.title; $("#fing").value = j.ingredients.join("\n"); $("#fsteps").value = j.steps.join("\n");
    m.className = "msg ok"; m.textContent = "Fiche créée. Vérifie-la, choisis un dossier, puis enregistre.";
  } catch (e) { m.className = "msg"; m.textContent = e.message; }
  b.disabled = false; b.textContent = "Créer la fiche";
}

$("#analyse").onclick = () => {
  const input = $("#src").value.trim();
  if (!input) { $("#addmsg").className = "msg"; $("#addmsg").textContent = "Colle d’abord un lien ou un texte."; return; }
  runParse({ input });
};

async function shrink(file) {
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.8);
}

$("#shot").onchange = async (e) => {
  const files = [...e.target.files].slice(0, 4); e.target.value = "";
  if (!files.length) return;
  try { runParse({ images: await Promise.all(files.map(shrink)) }); }
  catch { $("#addmsg").className = "msg"; $("#addmsg").textContent = "Impossible de lire cette image. Essaie avec une capture d’écran."; }
};

$("#save").onclick = async () => {
  const title = $("#ftitle").value.trim(), m = $("#addmsg"), src = $("#src").value.trim();
  if (!title) { m.className = "msg"; m.textContent = "Donne un titre à la recette."; return; }
  const row = { title, folder: $("#ffolder").value.trim() || "Sans dossier", ingredients: lines($("#fing").value), steps: lines($("#fsteps").value), source_url: /^https?:\/\/\S+$/i.test(src) ? src : null };
  const { error } = await db.from("recipes").insert(row);
  if (error) { m.className = "msg"; m.textContent = "Enregistrement impossible : " + error.message; return; }
  $("#add").close(); load();
};
</script>
</body>
</html>
